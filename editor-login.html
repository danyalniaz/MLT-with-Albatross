<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elementor Admin Login – MLThub by Albatross</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #7c3aed;
      --dark: #0f172a;
      --dark2: #1e293b;
      --light: #f8fafc;
      --border: rgba(255, 255, 255, 0.12);
      --font: 'Inter', sans-serif;
      --font-display: 'Poppins', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #f8fafc;
    }
    .login-box {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .brand-header { text-align: center; margin-bottom: 2rem; }
    .logo-badge {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: white; margin: 0 auto 1.25rem;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }
    .title { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: white; margin-bottom: 0.35rem; }
    .subtitle { font-size: 0.875rem; color: #94a3b8; }
    .credentials-hint {
      background: rgba(37, 99, 235, 0.15); border: 1px solid rgba(37, 99, 235, 0.3);
      color: #93c5fd; padding: 0.85rem 1rem; border-radius: 12px;
      font-size: 0.825rem; margin-bottom: 1.5rem; line-height: 1.5;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 0.95rem; }
    .input-wrap input {
      width: 100%; padding: 0.75rem 1rem 0.75rem 2.6rem; border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.15); background: rgba(15, 23, 42, 0.6);
      color: white; font-size: 0.9rem; outline: none; transition: all 0.25s ease;
    }
    .input-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25); }
    .btn-login {
      width: 100%; padding: 0.85rem; border-radius: 9999px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white; font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer;
      margin-top: 0.5rem; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-login:hover { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); }
    .btn-quick {
      width: 100%; padding: 0.75rem; border-radius: 9999px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white; font-weight: 700; font-size: 0.875rem; border: none; cursor: pointer;
      margin-top: 0.75rem; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-quick:hover { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); }
    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.85rem; margin-bottom: 1.25rem; display: none; }
    .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.825rem; color: #94a3b8; }
    .footer-link a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>

<div class="login-box">
  <div class="brand-header">
    <div class="logo-badge"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <h1 class="title">Visual Editor Admin</h1>
    <p class="subtitle">MLThub by Albatross Elementor Builder</p>
  </div>

  <div class="credentials-hint">
    <i class="fa-solid fa-key"></i> <strong>Initial Admin Credentials:</strong><br/>
    • <strong>Email:</strong> <code>admin@albatross.com</code><br/>
    • <strong>Password:</strong> <code>albatross123</code>
  </div>

  <div class="alert-error" id="loginAlert"></div>

  <form onsubmit="handleStudioLogin(event)">
    <div class="form-group">
      <label>Admin Email</label>
      <div class="input-wrap">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="email" value="admin@albatross.com" required/>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" value="albatross123" required/>
      </div>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In to Elementor Editor
    </button>
  </form>

  <button type="button" class="btn-quick" onclick="quickStudioLogin()">
    <i class="fa-solid fa-bolt"></i> One-Click Admin Sign In
  </button>

  <div class="footer-link">
    <a href="index.html" target="_blank">← Open Public Website</a>
  </div>
</div>

<script src="studio-core.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const session = window.MLTStudio.getCurrentSession();
    if (session) {
      window.location.href = 'editor.html';
    }
  });

  function handleStudioLogin(e) {
    e.preventDefault();
    const alertBox = document.getElementById('loginAlert');
    alertBox.style.display = 'none';

    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;

    try {
      window.MLTStudio.login(email, pass);
      window.location.href = 'editor.html';
    } catch (err) {
      alertBox.textContent = err.message || 'Login failed.';
      alertBox.style.display = 'block';
    }
  }

  function quickStudioLogin() {
    document.getElementById('email').value = 'admin@albatross.com';
    document.getElementById('password').value = 'albatross123';
    handleStudioLogin(new Event('submit'));
  }
</script>
</body>
</html>
